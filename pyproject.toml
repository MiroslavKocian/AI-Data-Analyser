[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E501"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = """
--cov=config --cov=repository --cov=data_transformer --cov=sql_runner
--cov=ai_provider --cov=state_manager --cov=pipeline_manager
--cov=sample_loader --cov=startup --cov=ui_renderer --cov=app
--cov-report=term-missing --cov-fail-under=100
"""
testpaths = ["tests"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
