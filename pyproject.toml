[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E501", "E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
minversion = "7.0"
pythonpath = ["."]
addopts = """
--cov=ai_data_analyser --cov=quality_gate --cov=run_app --cov=main
--cov-report=term-missing --cov-fail-under=100
"""
testpaths = ["tests"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
